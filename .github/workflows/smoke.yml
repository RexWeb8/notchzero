name: Smoke test

# Launches NotchZero on a Windows runner, hovers the island and saves screenshots.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish NotchZero.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Run and capture
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          $dir = Join-Path $env:LOCALAPPDATA "NotchZero"
          New-Item -ItemType Directory -Force $dir | Out-Null
          '{ "Mascot": "Cat", "ShowMascotWhenIdle": true, "ShowSongPeek": true, "AutoZone": false, "Zone": "WLY01", "FirstRunDone": true }' | Set-Content (Join-Path $dir "settings.json")

          function Shot([string]$name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "Screen: $($bounds.Width)x$($bounds.Height)" | Tee-Object shots\info.txt
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 200, 500

          $p = Start-Process -FilePath publish\NotchZero.exe -PassThru
          Start-Sleep -Seconds 15
          Shot "1-closed"

          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point ([int]($bounds.Width / 2)), 10
          Start-Sleep -Seconds 3
          Shot "2-open"
          Start-Sleep -Seconds 2
          Shot "3-open-later"

          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 200, 600
          Start-Sleep -Seconds 3
          Shot "4-closed-again"

          Copy-Item (Join-Path $dir "log.txt") shots\ -ErrorAction SilentlyContinue
          if ($p.HasExited) { "EXITED code $($p.ExitCode)" | Tee-Object -Append shots\info.txt; exit 1 }
          "Still running" | Tee-Object -Append shots\info.txt
          Stop-Process -Id $p.Id -Force

      - name: Install from the latest release, launch, uninstall
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          gh release download --repo $env:GITHUB_REPOSITORY --pattern NotchZero-Setup.exe --dir setup
          $log = "shots\install.txt"
          $setup = Start-Process setup\NotchZero-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=startup" -PassThru -Wait
          "Setup exit code: $($setup.ExitCode)" | Tee-Object -Append $log
          $exe = Join-Path $env:LOCALAPPDATA "Programs\NotchZero\NotchZero.exe"
          "Installed exe exists: $(Test-Path $exe)" | Tee-Object -Append $log
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name NotchZero -ErrorAction SilentlyContinue).NotchZero
          "Run key: $run" | Tee-Object -Append $log
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "NotchZero*.lnk" -Recurse -ErrorAction SilentlyContinue
          "Start menu shortcut: $($lnk.FullName)" | Tee-Object -Append $log

          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("shots\5-installed.png", [System.Drawing.Imaging.ImageFormat]::Png)
          "Installed app running: $(-not $p.HasExited)" | Tee-Object -Append $log

          $un = Start-Process (Join-Path $env:LOCALAPPDATA "Programs\NotchZero\unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          Start-Sleep -Seconds 3
          "Uninstall exit code: $($un.ExitCode)" | Tee-Object -Append $log
          "Exe after uninstall: $(Test-Path $exe)" | Tee-Object -Append $log
          $run2 = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name NotchZero -ErrorAction SilentlyContinue).NotchZero
          "Run key after uninstall: '$run2'" | Tee-Object -Append $log
          "Still running after uninstall: $((Get-Process NotchZero -ErrorAction SilentlyContinue) -ne $null)" | Tee-Object -Append $log

      - name: Save screenshots to the smoke-results branch
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan smoke-results
          git rm -rf --cached . | Out-Null
          git add -f shots
          git commit -m "Smoke test screenshots ($env:GITHUB_RUN_NUMBER)"
          git push -f origin smoke-results
